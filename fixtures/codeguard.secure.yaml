# Ownership-enforcing fixture. Local testing only.
# Policy: only the owner can read or modify their document.
base_url: http://127.0.0.1:8002
users:
  - name: alice
    token: alice-token
  - name: bob
    token: bob-token
resources:
  - id: 101
    owner: alice
  - id: 202
    owner: bob
routes:
  - method: GET
    path: /documents/{id}
    operation: read
  - method: PUT
    path: /documents/{id}
    operation: write
