# Intentionally vulnerable benchmark app. Local testing only. Not for production.
# Policy: only the owner can read or delete their document.
base_url: http://127.0.0.1:8105
target_app: benchmarks.uuid_ids.vulnerable.app:app
source_dir: benchmarks/uuid_ids/vulnerable
users:
  - name: alice
    token: alice-token
  - name: bob
    token: bob-token
resources:
  - id: "11111111-1111-4111-8111-111111111111"
    owner: alice
  - id: "22222222-2222-4222-8222-222222222222"
    owner: bob
routes:
  - method: GET
    path: /documents/{id}
    operation: read
  - method: DELETE
    path: /documents/{id}
    operation: write
