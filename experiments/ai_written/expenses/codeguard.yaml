# Owner-only policy. This file is the template, not model output.
# Port 8000 is a placeholder. The runner picks a free port and does not rewrite this file.
# source_dir is relative to this file.
base_url: http://127.0.0.1:8000
target_app: app:app
source_dir: "."
users:
  - name: alice
    token: alice-token
  - name: bob
    token: bob-token
resources:
  - id: "exp-alice-1"
    owner: alice
  - id: "exp-alice-2"
    owner: alice
  - id: "exp-bob-1"
    owner: bob
  - id: "exp-bob-2"
    owner: bob
routes:
  - method: GET
    path: "/expenses"
    operation: read
  - method: POST
    path: "/expenses"
    operation: write
  - method: GET
    path: "/expenses/{expense_id}"
    operation: read
  - method: DELETE
    path: "/expenses/{expense_id}"
    operation: write
